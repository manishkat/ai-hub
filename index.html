<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>AI Hub</title>
<style>
  :root{--bg:#0f1220;--panel:#1a1f36;--line:#2a3052;--text:#eef0fa;--muted:#a3a9c7;--accent:#7c8cff;--accent2:#4fd1c5;--free:#3ecf8e;--star:#ffcb6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#1d2347 0%,var(--bg) 60%) fixed;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.02em}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .search{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font:inherit;font-size:15px;margin-bottom:6px}
  .search:focus{outline:2px solid var(--accent);border-color:transparent}
  h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 10px}
  .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
  @media (min-width:480px){.apps{grid-template-columns:repeat(5,1fr)}}
  .app{background:none;border:none;padding:0;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit}
  .icon{position:relative;width:62px;height:62px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .12s}
  .app:active .icon{transform:scale(.9)}
  .icon img{width:66%;height:66%;object-fit:contain}
  .icon .letter{position:absolute;inset:0;display:none;place-items:center;font-weight:800;font-size:26px;color:#fff}
  .icon.fallback img{display:none}
  .icon.fallback .letter{display:grid}
  .icon .dot{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:var(--star);border:2px solid #fff}
  .label{font-size:11.5px;line-height:1.2;text-align:center;max-width:76px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .empty{color:var(--muted);text-align:center;padding:30px 0;display:none}
  /* bottom sheet */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--panel);border-radius:22px 22px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;z-index:11;max-height:85vh;overflow:auto}
  .sheet.show{transform:none}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
  .shead{display:flex;gap:14px;align-items:center}
  .shead .icon{width:64px;height:64px;flex:none}
  .shead h3{margin:0;font-size:21px}
  .shead .cat{font-size:13px;color:var(--muted)}
  .badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .b{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .b.free{color:var(--free);border-color:var(--free)}
  .b.star{color:var(--star);border-color:var(--star)}
  .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);margin:18px 0 6px}
  .sheet ul{margin:0;padding-left:18px}
  .sheet li{margin:4px 0;font-size:15px;line-height:1.45}
  .sheet p{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
  .btns{display:flex;gap:10px;margin-top:22px}
  .open{flex:1;text-align:center;padding:13px;border-radius:14px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:16px}
  .close{padding:13px 18px;border-radius:14px;background:transparent;border:1px solid var(--line);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
  .voice{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border:none;border-radius:16px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0f1220;font:inherit;font-weight:800;font-size:16px;cursor:pointer;margin:0 0 10px;box-shadow:0 6px 20px rgba(124,140,255,.35)}
  .voice:active{transform:scale(.98)}
  .modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .mode{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:13px;cursor:pointer}
  .mode.on{background:var(--accent);border-color:var(--accent);color:#fff}
  textarea{width:100%;min-height:110px;margin-top:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font:inherit;font-size:15px;resize:vertical}
  .mic{width:76px;height:76px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:32px;cursor:pointer;display:block;margin:18px auto 6px}
  .mic.rec{background:#e5484d;animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.6)}100%{box-shadow:0 0 0 18px rgba(229,72,77,0)}}
  .hint{text-align:center;font-size:13px;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🏠 <span>AI Hub</span></h1></header>
  <button class="voice" id="voiceBtn">🎙️ Tell AI what to build</button>
  <input id="q" class="search" type="search" placeholder="Search apps…" aria-label="Search apps">
  <div id="list"></div>
  <div class="empty" id="empty">No apps found.</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="shead">
    <div class="icon" id="sIcon"></div>
    <div><h3 id="sName"></h3><div class="cat" id="sCat"></div><div class="badges" id="sBadges"></div></div>
  </div>
  <div class="lbl">What it can do</div>
  <ul id="sCan"></ul>
  <div class="lbl">How it helps me</div>
  <p id="sHelp"></p>
  <div class="btns"><a class="open" id="sOpen" target="_blank" rel="noopener">Open app ↗</a><button class="close" id="sClose">Close</button></div>
</div>

<div class="sheet" id="build" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 style="margin:0;font-size:21px">🎙️ Build with voice</h3>
  <div class="modes" id="modes">
    <button class="mode on" data-m="web">🌐 Website prototype</button>
    <button class="mode" data-m="app">📱 App screens</button>
    <button class="mode" data-m="any">💬 Anything</button>
  </div>
  <button class="mic" id="mic" aria-label="Start speaking">🎙️</button>
  <p class="hint" id="hint">Tap the mic and say what you want</p>
  <textarea id="idea" placeholder="e.g. A website for my cyber security business in Darwin that does security health checks for small businesses"></textarea>
  <div class="btns"><a class="open" id="send" target="_blank" rel="noopener">Send to Claude ↗</a><button class="close" id="copyBtn">Copy</button></div>
  <p class="hint" style="margin-top:12px">Claude opens with your request ready. Check it, then press send.</p>
</div>

<script>
const CATS = [
  {id:"fav", name:"⭐ Starter pack"},
  {id:"chat", name:"🧠 Chat assistants"},
  {id:"research", name:"🔍 Research & study"},
  {id:"code", name:"💻 Coding"},
  {id:"cyber", name:"🛡️ Cybersecurity"},
  {id:"auto", name:"⚙️ Automation & agents"},
  {id:"media", name:"🎨 Images, video & design"},
  {id:"voice", name:"🎙️ Voice & meetings"},
  {id:"prod", name:"📒 Productivity & life"},
  {id:"money", name:"💰 Money"}
];

const TOOLS = [
  {c:"chat", n:"Claude", d:"claude.ai", u:"https://claude.ai", col:"#d97757", free:1, top:1,
   can:["Write and edit long assignments and reports","Explain hard topics step by step","Write and fix code","Read your Gmail, Drive and calendar (connectors)","Run scheduled tasks automatically (AI employee)"],
   h:"My main hub: explains CDU topics, plans my week, runs my Sunday review and helps build my startup."},
  {c:"chat", n:"ChatGPT", d:"chatgpt.com", u:"https://chatgpt.com", col:"#10a37f", free:1,
   can:["Chat and answer everyday questions","Make images from a description","Voice conversations","Analyse files and photos"],
   h:"Second opinion on answers, quick images, and voice chat to practise explaining topics or interview answers."},
  {c:"chat", n:"Gemini", d:"gemini.google.com", u:"https://gemini.google.com", col:"#4285f4", free:1,
   can:["Chat and research with Google Search","Work inside Gmail, Docs and Drive","Summarise YouTube videos","Make images"],
   h:"Summarises long YouTube tutorials and works directly in my Google files."},
  {c:"chat", n:"Copilot", d:"copilot.microsoft.com", u:"https://copilot.microsoft.com", col:"#0078d4", free:1,
   can:["Chat and search the web","Help inside Word, Excel, PowerPoint and Outlook","Make images"],
   h:"Helps with Office work and is used in many workplaces, so it's good to know for jobs."},
  {c:"chat", n:"Grok", d:"grok.com", u:"https://grok.com", col:"#111111", free:1,
   can:["Chat with real-time info","See live news and trends from X (Twitter)","Make images"],
   h:"Quick check on breaking cyber news and what security people are talking about right now."},

  {c:"research", n:"Perplexity", d:"perplexity.ai", u:"https://www.perplexity.ai", col:"#20808d", free:1, top:1,
   can:["Search the web and give a direct answer","Show the sources it used","Deep research reports"],
   h:"Fast research for assignments and startup ideas, with sources I can check and reference."},
  {c:"research", n:"NotebookLM", d:"notebooklm.google.com", u:"https://notebooklm.google.com", col:"#1a73e8", free:1, top:1,
   can:["Upload PDFs, slides and notes","Summaries, quizzes and flashcards from them","Turn notes into an audio podcast","Answer questions only from your files"],
   h:"Turn CDU lecture slides into quizzes and podcasts I can listen to while driving or at the gym."},
  {c:"research", n:"Consensus", d:"consensus.app", u:"https://consensus.app", col:"#1e66f5", free:1,
   can:["Search academic research papers","Summarise what studies found"],
   h:"Find real academic sources for CDU reports and literature reviews."},
  {c:"research", n:"Elicit", d:"elicit.com", u:"https://elicit.com", col:"#3c4f76", free:1,
   can:["Find and sort research papers","Pull key points into a table"],
   h:"Speeds up literature reviews."},
  {c:"research", n:"Grammarly", d:"grammarly.com", u:"https://www.grammarly.com", col:"#15c39a", free:1,
   can:["Fix grammar and spelling as you type","Improve clarity and tone"],
   h:"Makes my assignments, emails and job applications sound professional."},
  {c:"research", n:"QuillBot", d:"quillbot.com", u:"https://quillbot.com", col:"#499557", free:1,
   can:["Paraphrase sentences","Grammar check","Summarise text"],
   h:"Rewords my own writing. Follow CDU's academic integrity rules."},

  {c:"code", n:"Claude Code", d:"claude.com", u:"https://claude.com/claude-code", col:"#d97757",
   can:["Build whole apps and scripts","Find and fix bugs","Explain code step by step"],
   h:"Build scripts, security tools and my startup website faster."},
  {c:"code", n:"GitHub Copilot", d:"github.com", u:"https://education.github.com/pack", col:"#24292f", free:1, top:1,
   can:["Suggest code as you type in VS Code","Chat about your code","Free for students (Student Pack)"],
   h:"Write Python/Bash for cyber labs faster. The Student Pack gives many free tools."},
  {c:"code", n:"Cursor", d:"cursor.com", u:"https://cursor.com", col:"#000000", free:1,
   can:["Code editor with AI built in","Edit a whole project by chatting"],
   h:"Good for bigger coding projects."},

  {c:"cyber", n:"Security Copilot", d:"microsoft.com", u:"https://learn.microsoft.com/en-us/copilot/security/", col:"#0078d4",
   can:["Investigate security incidents with AI","Summarise threats and alerts","Used by SOC analysts at work"],
   h:"Learn what it does now. Employers use it, so it's a plus for SOC jobs and my internship."},
  {c:"cyber", n:"Claude (Cyber)", d:"claude.ai", u:"https://claude.ai", col:"#d97757", free:1,
   can:["Explain CVEs, logs and malware reports","Quiz you for Security+ and other certs","Review your lab reports"],
   h:"My personal cyber tutor."},
  {c:"cyber", n:"TryHackMe", d:"tryhackme.com", u:"https://tryhackme.com", col:"#212c42", free:1,
   can:["Beginner hacking labs in your browser","Learning paths (SOC, pentesting)","Badges for your profile"],
   h:"Real practice for cyber skills, plus a profile I can show employers."},
  {c:"cyber", n:"Hack The Box", d:"hackthebox.com", u:"https://www.hackthebox.com", col:"#111927", free:1,
   can:["Harder hacking labs and challenges","Industry certifications"],
   h:"Next level after TryHackMe, for penetration testing roles."},

  {c:"auto", n:"Claude Tasks", d:"claude.ai", u:"https://claude.ai", col:"#d97757", top:1,
   can:["Run tasks on a schedule","Check email, news and goals automatically","Send results to your phone"],
   h:"My AI employee ✅: the Sunday review every week."},
  {c:"auto", n:"n8n", d:"n8n.io", u:"https://n8n.io", col:"#ea4b71", free:1,
   can:["Connect apps: when X happens, do Y","Build AI agents visually","Free if self-hosted"],
   h:"Learn APIs, webhooks and Docker, and build automations to sell to small businesses."},
  {c:"auto", n:"Zapier", d:"zapier.com", u:"https://zapier.com", col:"#ff4f00", free:1,
   can:["Easy no-code automations between apps"],
   h:"Quick simple automations without any setup."},
  {c:"auto", n:"Make", d:"make.com", u:"https://www.make.com", col:"#6d00cc", free:1,
   can:["Visual no-code automation","Cheaper for bigger workflows"],
   h:"Build visual workflows for my startup without hosting anything."},

  {c:"media", n:"Canva", d:"canva.com", u:"https://www.canva.com", col:"#00c4cc", free:1, top:1,
   can:["Logos, posters and social posts","Slides and simple videos","AI image and text tools"],
   h:"Startup logo, flyers and posts, plus nice slides for CDU presentations."},
  {c:"media", n:"Midjourney", d:"midjourney.com", u:"https://www.midjourney.com", col:"#000000",
   can:["Very high-quality AI images"],
   h:"Images for my startup brand and website (paid)."},
  {c:"media", n:"ChatGPT Images", d:"chatgpt.com", u:"https://chatgpt.com", col:"#10a37f", free:1,
   can:["Make images by describing them"],
   h:"Quick free images for posts and ideas."},
  {c:"media", n:"Imagen", d:"gemini.google.com", u:"https://gemini.google.com", col:"#4285f4", free:1,
   can:["Google's image generator inside Gemini"],
   h:"Another free option for quick images."},
  {c:"media", n:"CapCut", d:"capcut.com", u:"https://www.capcut.com", col:"#000000", free:1,
   can:["Edit videos for TikTok, Reels and YouTube","Auto captions and templates"],
   h:"Short videos to market my startup or share cyber tips."},
  {c:"media", n:"Runway", d:"runwayml.com", u:"https://runwayml.com", col:"#000000",
   can:["Make and edit videos with AI"],
   h:"Short promo clips for the startup."},
  {c:"media", n:"Veo", d:"deepmind.google", u:"https://deepmind.google/models/veo/", col:"#4285f4",
   can:["Google's AI video generator"],
   h:"Turn a text idea into a short video."},
  {c:"media", n:"Sora", d:"sora.com", u:"https://sora.com", col:"#000000",
   can:["OpenAI's AI video generator"],
   h:"Another option for short AI videos."},
  {c:"media", n:"Synthesia", d:"synthesia.io", u:"https://www.synthesia.io", col:"#3c3ce6",
   can:["Videos with talking AI avatars","Many languages"],
   h:"Explainer videos without filming myself."},
  {c:"media", n:"HeyGen", d:"heygen.com", u:"https://www.heygen.com", col:"#7559ff", free:1,
   can:["AI talking avatars","Translate videos into other languages"],
   h:"Videos in English, Nepali and Hindi."},

  {c:"voice", n:"Otter.ai", d:"otter.ai", u:"https://otter.ai", col:"#2a5cff", free:1,
   can:["Record lectures and meetings","Automatic notes and action items"],
   h:"Never miss anything in CDU lectures and group meetings."},
  {c:"voice", n:"Fireflies", d:"fireflies.ai", u:"https://fireflies.ai", col:"#e8336d", free:1,
   can:["AI notetaker for Zoom/Teams calls"],
   h:"Automatic notes from online group meetings."},
  {c:"voice", n:"ElevenLabs", d:"elevenlabs.io", u:"https://elevenlabs.io", col:"#000000", free:1,
   can:["Realistic AI voices and voiceovers","Turn text into audio"],
   h:"Voiceovers for startup videos, or listen to my notes."},

  {c:"prod", n:"Notion", d:"notion.so", u:"https://www.notion.so", col:"#000000",
   can:["Notes, planner and wiki","AI to write and summarise"],
   h:"Keep notes, goals and startup ideas in one place."},
  {c:"prod", n:"Motion", d:"usemotion.com", u:"https://www.usemotion.com", col:"#3f6fff",
   can:["Auto-plans your calendar around tasks"],
   h:"Fits study, shifts, gym and startup time into my week (paid)."},
  {c:"prod", n:"Reclaim", d:"reclaim.ai", u:"https://reclaim.ai", col:"#5a4fcf", free:1,
   can:["Protects calendar time for habits and tasks"],
   h:"Blocks time for gym, meditation and study around my shifts."},
  {c:"prod", n:"Gamma", d:"gamma.app", u:"https://gamma.app", col:"#7c3aed", free:1,
   can:["Makes slide decks in seconds from text"],
   h:"Quick drafts of CDU presentations and pitch decks."},

  {c:"money", n:"Claude (Money)", d:"claude.ai", u:"https://claude.ai", col:"#d97757", free:1,
   can:["Explain ETFs, super and budgets simply","Build a budget sheet"],
   h:"Learn how investing works. It gives info, not personal financial advice."},
  {c:"money", n:"Moneysmart", d:"moneysmart.gov.au", u:"https://moneysmart.gov.au", col:"#00698f", free:1,
   can:["Budget planner and calculators","Savings, super and investing guides","Australian government site (not AI)"],
   h:"My trusted check before money decisions."}
];

const esc = s => String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const iconHTML = (t, big) => '<div class="icon'+'"><img alt="" loading="lazy" src="https://www.google.com/s2/favicons?domain='+t.d+'&sz=128" onerror="this.parentNode.classList.add(\'fallback\')"><span class="letter" style="background:'+t.col+'">'+esc(t.n[0])+'</span>'+(t.top&&!big?'<span class="dot"></span>':'')+'</div>';
const catName = id => (CATS.find(c=>c.id===id)||{}).name || "";

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  let html = "", count = 0;
  CATS.forEach(cat=>{
    const items = TOOLS.map((t,i)=>({t,i})).filter(({t}) => (cat.id==="fav" ? t.top : t.c===cat.id) && (!q || (t.n+" "+t.can.join(" ")+" "+t.h+" "+cat.name).toLowerCase().includes(q)));
    if(!items.length || (q && cat.id==="fav")) return;
    count += items.length;
    html += '<h2>'+cat.name+'</h2><div class="apps">';
    items.forEach(({t,i})=>{ html += '<button class="app" data-i="'+i+'">'+iconHTML(t)+'<span class="label">'+esc(t.n)+'</span></button>'; });
    html += '</div>';
  });
  document.getElementById("list").innerHTML = html;
  document.getElementById("empty").style.display = count ? "none" : "block";
}

const sheet = document.getElementById("sheet"), overlay = document.getElementById("overlay");
function openSheet(i){
  const t = TOOLS[i];
  document.getElementById("sIcon").outerHTML = iconHTML(t,true).replace('<div class="icon"','<div class="icon" id="sIcon"');
  document.getElementById("sName").textContent = t.n;
  document.getElementById("sCat").textContent = catName(t.c);
  document.getElementById("sBadges").innerHTML = (t.top?'<span class="b star">⭐ Starter</span>':'') + (t.free?'<span class="b free">🆓 Free version</span>':'<span class="b">Paid</span>');
  document.getElementById("sCan").innerHTML = t.can.map(x=>'<li>'+esc(x)+'</li>').join("");
  document.getElementById("sHelp").textContent = t.h;
  document.getElementById("sOpen").href = t.u;
  sheet.classList.add("show"); overlay.classList.add("show");
}
function closeSheet(){ sheet.classList.remove("show"); build.classList.remove("show"); overlay.classList.remove("show"); if(recording && rec) rec.stop(); }

/* ---- Build with voice ---- */
const build = document.getElementById("build"), idea = document.getElementById("idea"), mic = document.getElementById("mic"), hint = document.getElementById("hint"), copyBtn = document.getElementById("copyBtn");
let mode = "web", rec = null, recording = false, base = "";
const TPL = {
  web: "Design a clickable website prototype for: IDEA\n\nMake it with Claude Design (the Design type). If I add a Figma link, use my Figma connector to match that design.\nInclude: a home page and the main pages, desktop and mobile layouts, clear navigation, a clean modern style and realistic placeholder text.\nOnly ask me up to 2 short questions if something important is missing.",
  app: "Design mobile app screens for: IDEA\n\nMake them with Claude Design (the Design type). If I add a Figma link, use my Figma connector to match that design.\nInclude: the main screens, the flow between them, a clean modern style and realistic placeholder content.\nOnly ask me up to 2 short questions if something important is missing.",
  any: "IDEA"
};
const buildPrompt = () => TPL[mode].replace("IDEA", idea.value.trim() || "(describe your idea)");
const updLink = () => { document.getElementById("send").href = "https://claude.ai/new?q=" + encodeURIComponent(buildPrompt()); copyBtn.textContent = "Copy"; };
document.getElementById("voiceBtn").addEventListener("click", () => { updLink(); build.classList.add("show"); overlay.classList.add("show"); });
document.getElementById("modes").addEventListener("click", e => { const b = e.target.closest(".mode"); if(!b) return; mode = b.dataset.m; [...document.querySelectorAll(".mode")].forEach(x => x.classList.toggle("on", x === b)); updLink(); });
idea.addEventListener("input", updLink);
copyBtn.addEventListener("click", () => { navigator.clipboard.writeText(buildPrompt()).then(() => copyBtn.textContent = "Copied ✓").catch(() => { idea.select(); copyBtn.textContent = "Select & copy"; }); });
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
mic.addEventListener("click", () => {
  if(!SR){ hint.textContent = "Voice isn't supported here. Tap the 🎤 on your keyboard instead."; idea.focus(); return; }
  if(recording){ rec.stop(); return; }
  rec = new SR(); rec.lang = "en-AU"; rec.interimResults = true; rec.continuous = true;
  base = idea.value.trim() ? idea.value.trim() + " " : "";
  rec.onstart = () => { recording = true; mic.classList.add("rec"); hint.textContent = "Listening… tap again to stop"; };
  rec.onresult = e => { let t = ""; for(let i = 0; i < e.results.length; i++){ t += e.results[i][0].transcript; } idea.value = base + t; updLink(); };
  rec.onerror = e => { hint.textContent = e.error === "not-allowed" ? "Please allow microphone access, or use the 🎤 on your keyboard." : "Voice problem (" + e.error + "). Try again or type."; };
  rec.onend = () => { recording = false; mic.classList.remove("rec"); if(!hint.textContent.startsWith("Please") && !hint.textContent.startsWith("Voice")) hint.textContent = "Done. Edit if needed, then send."; };
  try { rec.start(); } catch(err) { hint.textContent = "Couldn't start the mic. Type instead."; }
});
document.getElementById("list").addEventListener("click", e => { const b = e.target.closest(".app"); if(b) openSheet(+b.dataset.i); });
overlay.addEventListener("click", closeSheet);
document.getElementById("sClose").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });
document.getElementById("q").addEventListener("input", render);
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
